services:
  worker:
    build:
      context: ../../
      target: worker
      args:
        BUILD_ON: ${BUILD_ON}
        FLAVOR: ${FLAVOR}
        BUILD_TYPE: ${BUILD_TYPE}
    restart: unless-stopped
    environment:
      LOG_PATH: /home/app/logs/worker
    env_file:
      - ${APP_ENV_FILE:-../../deploy/${FLAVOR}.env}
    volumes:
      - service-logs:/home/app/logs
      - worker-home:/home/app

volumes:
  worker-home:
